<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" width="1400" height="900" role="img" aria-label="Cztery typy węzłów w grze">
<title>Cztery typy węzłów w grze</title>
<desc>Ilustracja przedstawiająca generator, odbiornik, wzmacniacz i tłumik.</desc>
<defs>
