    <stop offset="0%" stop-color="#111a30"/>
    <stop offset="100%" stop-color="#070a12"/>
  </linearGradient>
  <linearGradient id="pulse-nodes" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1400" y2="900">
    <stop offset="0%" stop-color="#4cf1e0"/>
    <stop offset="100%" stop-color="#b39bff"/>
  </linearGradient>
  <filter id="glow-nodes" filterUnits="userSpaceOnUse" x="-40" y="-40" width="1480" height="980">
    <feGaussianBlur stdDeviation="5" result="blur"/>
    <feMerge>
      <feMergeNode in="blur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>
</defs>
